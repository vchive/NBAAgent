# Optional Qianfan AI Search override. Combine this file with the public,
# auth and SiliconFlow profiles after configuring secrets/qianfan_search_api_key.
x-search-service: &search-service
    environment:
      QIANFAN_SEARCH_ENABLED: "true"
      QIANFAN_SEARCH_API_KEY_FILE: /run/secrets/qianfan_search_api_key
      QIANFAN_SEARCH_TIMEOUT_SECONDS: 8
      QIANFAN_SEARCH_MAX_RESULTS: 5
      QIANFAN_SEARCH_MAX_RESPONSE_BYTES: 800000
    secrets:
      - qianfan_search_api_key

services:
  flower-agent:
    <<: *search-service
  nba-agent:
    <<: *search-service

secrets:
  qianfan_search_api_key:
    file: ./secrets/qianfan_search_api_key
